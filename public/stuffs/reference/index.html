<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<template id="__bundler_thumbnail" data-bg-color="#0119FE">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#0119FE"/>
    <g transform="translate(600,340) scale(3.5)" fill="#fff">
      <path d="M33.4,29.3l-3.6,3.6c-1.3,1.3-3.5,1.3-4.8,0l-3.5-3.5c-1.3-1.3-1.3-3.5,0-4.8l2.1-2.1c1.3-1.3,1.3-3.5,0-4.8l-3.4-3.4c-1.3-1.3-1.3-3.5,0-4.8l8.1-8.1c1.3-1.3,3.5-1.3,4.8,0l3.4,3.4c1.3,1.3,1.3,3.5,0,4.8l-6.6,6.6c-1.3,1.3-1.3,3.5,0,4.8l3.5,3.5C35.1,26.1,35.1,28.1,33.4,29.3z"/>
      <path d="M4.2,9.7l3.6-3.6c1.3-1.3,3.5-1.3,4.8,0l3.5,3.5c1.3,1.3,1.3,3.5,0,4.8l-2.1,2.1c-1.3,1.3-1.3,3.5,0,4.8l3.4,3.4c1.3,1.3,1.3,3.5,0,4.8l-8.1,8.1c-1.3,1.3-3.5,1.3-4.8,0l-3.4-3.4C-.3,32.9-.3,30.7,1,29.4l6.6-6.6c1.3-1.3,1.3-3.5,0-4.8L4.1,14.5C2.7,13,2.7,11.1,4.2,9.7z"/>
    </g>
    <rect x="440" y="430" width="320" height="8" rx="4" fill="rgba(255,255,255,0.6)"/>
    <rect x="490" y="452" width="220" height="5" rx="2.5" fill="rgba(255,255,255,0.3)"/>
  </svg>
</template>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fibex — True Speed. True Connection.</title>
<style>
@font-face { font-family: 'Origin'; src: url('./fonts/Origin-Heavy.otf') format('opentype'); font-weight: 900; }
@font-face { font-family: 'Montserrat'; src: url('./fonts/Montserrat-Regular.otf') format('opentype'); font-weight: 400; }
@font-face { font-family: 'Montserrat'; src: url('./fonts/Montserrat-SemiBold.otf') format('opentype'); font-weight: 600; }
@font-face { font-family: 'Baufra'; src: url('./fonts/Baufra-Light.ttf') format('truetype'); font-weight: 300; }

* { margin: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { font-family: 'Montserrat', sans-serif; background: #fff; -webkit-font-smoothing: antialiased; }
#root { min-height: 100vh; }
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: #f0f0f0; }
::-webkit-scrollbar-thumb { background: #bbb; border-radius: 4px; }

#tweak-panel {
  display: none; position: fixed; bottom: 24px; right: 24px; z-index: 9999;
  background: #fff; border-radius: 16px; box-shadow: 0 8px 40px rgba(0,0,0,0.18);
  padding: 24px 28px; min-width: 260px; border: 1.5px solid #e0e0e0;
}
#tweak-panel h3 { font-family: 'Origin', sans-serif; font-weight: 900; font-size: 18px; color: #000; margin-bottom: 20px; }
.tweak-row { margin-bottom: 16px; }
.tweak-label { font-family: 'Montserrat', sans-serif; font-size: 11px; font-weight: 600; color: #666; letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 6px; display: block; }
.tweak-row select, .tweak-row input[type="color"] { width: 100%; padding: 8px 12px; border-radius: 8px; border: 1.5px solid #e0e0e0; font-family: 'Montserrat', sans-serif; font-size: 13px; cursor: pointer; }
.tweak-row input[type="color"] { height: 36px; padding: 2px 6px; }

.page-enter { animation: fadeUp 0.25s ease forwards; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

.why-section { padding: 96px 56px; max-width: 1200px; margin: 0 auto; }
.why-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 32px; margin-top: 56px; }
.why-item { border-top: 2px solid #000; padding-top: 24px; }
.why-title { font-family: 'Origin', sans-serif; font-weight: 900; font-size: 20px; color: #000; margin-bottom: 10px; }
.why-desc { font-family: 'Montserrat', sans-serif; font-size: 14px; color: #666; line-height: 1.7; }
.cta-banner { background: #0119FE; padding: 80px 56px; text-align: center; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="Shared.jsx"></script>
<script type="text/babel" src="Header.jsx"></script>
<script type="text/babel" src="Hero.jsx"></script>
<script type="text/babel" src="Plans.jsx"></script>
<script type="text/babel" src="Testimonials.jsx"></script>
<script type="text/babel" src="About.jsx"></script>
<script type="text/babel" src="Contact.jsx"></script>
<script type="text/babel" src="Footer.jsx"></script>

<script type="text/babel">

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "heroHeadline1": "Zero lags,",
  "heroHeadline2": "Stable wins",
  "heroSub": "Your journey starts here",
  "accentColor": "#F12400",
  "heroStyle": "light"
}/*EDITMODE-END*/;

// ── Home Plans Slider ────────────────────────────────────────────────────────
function HomePlansSlider({ onNav }) {
  const [category, setCategory] = React.useState('residential');

  const categories = [
    { id: 'residential', label: 'Residential' },
    { id: 'business', label: 'Business' },
    { id: 'dia', label: 'Direct Internet Access' },
  ];

  const residentialPlans = [
    { name: 'ELITE',   price: '₱999',   speed: '200',   unit: 'Mbps', bg: '#fff',    fg: '#000' },
    { name: 'RUSH',    price: '₱1,499', speed: '300',   unit: 'Mbps', bg: '#0119FE', fg: '#fff' },
    { name: 'BLAZE',   price: '₱1,999', speed: '400',   unit: 'Mbps', bg: '#0119FE', fg: '#fff' },
    { name: 'TURBO',   price: '₱2,499', speed: '500',   unit: 'Mbps', bg: '#fff',    fg: '#000' },
    { name: 'PREMIUM', price: '₱7,999', speed: '1,000', unit: 'Mbps', bg: '#0119FE', fg: '#fff' },
  ];

  const businessPlans = [
    { name: 'STARTER', price: '₱2,499', speed: '100', unit: 'Mbps', bg: '#fff',    fg: '#000' },
    { name: 'PLUS',    price: '₱2,700', speed: '150', unit: 'Mbps', bg: '#0119FE', fg: '#fff' },
    { name: 'PRO',     price: '₱3,299', speed: '200', unit: 'Mbps', bg: '#0119FE', fg: '#fff' },
    { name: 'TURBO',   price: '₱4,999', speed: '300', unit: 'Mbps', bg: '#fff',    fg: '#000' },
    { name: 'MAX',     price: '₱9,999', speed: '500', unit: 'Mbps', bg: '#0119FE', fg: '#fff' },
  ];

  const s = {
    wrap: { background: '#f5f5f5', padding: '80px 56px' },
    sliderRow: { display: 'flex', justifyContent: 'center', marginBottom: 48 },
    sliderInner: { display: 'flex', background: '#e0e0e0', borderRadius: 9999, padding: 4, gap: 2 },
    sliderBtn: (active) => ({
      fontFamily: "'Montserrat', sans-serif", fontWeight: 600, fontSize: 13,
      padding: '10px 24px', borderRadius: 9999, border: 'none', cursor: 'pointer',
      background: active ? '#0119FE' : 'transparent',
      color: active ? '#fff' : '#555',
      transition: 'all 0.2s',
    }),
    header: { textAlign: 'center', marginBottom: 40 },
    eyebrow: { fontFamily: "'Baufra', sans-serif", fontWeight: 700, fontSize: 10, letterSpacing: '0.4em', textTransform: 'uppercase', color: '#0119FE', marginBottom: 10 },
    h2: { fontFamily: "'Origin', sans-serif", fontWeight: 900, fontSize: 'clamp(28px, 3.5vw, 48px)', color: '#000', lineHeight: 1.05, marginBottom: 10 },
    sub: { fontFamily: "'Montserrat', sans-serif", fontSize: 15, color: '#666' },
    grid: { display: 'grid', gridTemplateColumns: 'repeat(5, 1fr)', gap: 16, maxWidth: 1200, margin: '0 auto' },
    card: (bg) => ({ background: bg, borderRadius: 20, padding: '28px 24px', cursor: 'pointer', boxShadow: '0 4px 16px rgba(0,0,0,0.08)', transition: 'transform 0.15s' }),
    diaBox: {
      background: '#000', borderRadius: 24, padding: '56px', maxWidth: 1200, margin: '0 auto',
      display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 56, alignItems: 'center',
    },
    diaH2: { fontFamily: "'Origin', sans-serif", fontWeight: 900, fontSize: 40, color: '#fff', lineHeight: 1.05, marginBottom: 16 },
    diaBody: { fontFamily: "'Montserrat', sans-serif", fontSize: 14, color: 'rgba(255,255,255,0.6)', lineHeight: 1.8, marginBottom: 24 },
    diaTag: { display: 'inline-block', background: '#F12400', color: '#fff', fontFamily: "'Origin', sans-serif", fontWeight: 900, fontSize: 11, padding: '6px 16px', borderRadius: 9999, marginBottom: 20 },
    diaPoints: { display: 'flex', flexDirection: 'column', gap: 10 },
    diaPoint: { display: 'flex', gap: 10, alignItems: 'center', fontFamily: "'Montserrat', sans-serif", fontSize: 13, color: 'rgba(255,255,255,0.75)' },
    diaDot: { width: 20, height: 20, borderRadius: '50%', background: '#0119FE', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 10, color: '#fff', fontWeight: 700, flexShrink: 0 },
  };

  function MiniCard({ plan, category }) {
    const fg = plan.fg;
    return (
      <div
        style={s.card(plan.bg)}
        onClick={() => onNav('Plans')}
        onMouseEnter={e => e.currentTarget.style.transform = 'translateY(-4px)'}
        onMouseLeave={e => e.currentTarget.style.transform = 'none'}
      >
        <div style={{ fontFamily: "'Baufra', sans-serif", fontWeight: 700, fontSize: 9, letterSpacing: '0.35em', textTransform: 'uppercase', color: fg === '#fff' ? 'rgba(255,255,255,0.45)' : '#888', marginBottom: 8 }}>Fibex</div>
        <div style={{ fontFamily: "'Origin', sans-serif", fontWeight: 700, fontSize: 14, color: fg === '#fff' ? '#fff' : '#000', marginBottom: 14, lineHeight: 1.2 }}>{plan.name}</div>
        <div style={{ fontFamily: "'Origin', sans-serif", fontWeight: 900, fontSize: 40, color: fg === '#fff' ? '#fff' : '#0119FE', lineHeight: 1, marginBottom: 2 }}>{plan.speed}</div>
        <div style={{ fontFamily: "'Montserrat', sans-serif", fontSize: 11, color: fg === '#fff' ? 'rgba(255,255,255,0.5)' : '#999', marginBottom: 14 }}>{plan.unit}</div>
        <div style={{ fontFamily: "'Montserrat', sans-serif", fontWeight: 600, fontSize: 14, color: fg === '#fff' ? '#fff' : '#000' }}>{plan.price}<span style={{ fontWeight: 400, fontSize: 11 }}>/mo</span></div>
      </div>
    );
  }

  const currentPlans = category === 'residential' ? residentialPlans : businessPlans;
  const labels = {
    residential: { eyebrow: 'Residential Plans', h2: 'Honest plans. Real speeds.', sub: 'From ₱999/mo · Unlimited data · Free installation · No lock-in' },
    business:    { eyebrow: 'Business Plans',     h2: 'Built for business.',        sub: 'From ₱2,499/mo · Static IP available · Priority support' },
  };

  return (
    <div style={s.wrap}>
      <div style={s.sliderRow}>
        <div style={s.sliderInner}>
          {categories.map(c => (
            <button key={c.id} style={s.sliderBtn(category === c.id)} onClick={() => setCategory(c.id)}>
              {c.label}
            </button>
          ))}
        </div>
      </div>

      {category !== 'dia' && (
        <>
          <div style={s.header}>
            <div style={s.eyebrow}>{labels[category].eyebrow}</div>
            <h2 style={s.h2}>{labels[category].h2}</h2>
            <p style={s.sub}>{labels[category].sub}</p>
          </div>
          <div style={s.grid}>
            {currentPlans.map(p => <MiniCard key={p.name} plan={p} category={category} />)}
          </div>
          <div style={{ textAlign: 'center', marginTop: 40 }}>
            <FibexBtn variant="primary" size="lg" onClick={() => onNav('Plans')}>See All Plans</FibexBtn>
          </div>
        </>
      )}

      {category === 'dia' && (
        <div style={s.diaBox}>
          <div>
            <div style={s.diaTag}>DIA Line</div>
            <h2 style={s.diaH2}>Dedicated Fiber.<br/>Just for you.</h2>
            <p style={s.diaBody}>
              Designed for large establishments that require high-performance, secure, and always-on internet. A dedicated, uncontended fiber connection exclusively assigned to the client — consistent speeds, low latency, and reliable uptime.
            </p>
            <FibexBtn variant="primary" size="lg" onClick={() => onNav('Plans')}>Learn More & Request a Quote</FibexBtn>
          </div>
          <div style={s.diaPoints}>
            {['Uncontended, dedicated bandwidth', 'Symmetrical upload & download speeds', 'Static IP address included', '99.9% Uptime SLA', '24/7 monitoring & rapid response', 'Dedicated account manager', 'Custom enterprise agreements'].map(pt => (
              <div key={pt} style={s.diaPoint}>
                <div style={s.diaDot}>✓</div>
                {pt}
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// ── Home page ────────────────────────────────────────────────────────────────
function HomePage({ onNav }) {
  const whyItems = [
    { title: 'Honest Pricing', desc: 'No hidden charges. No exaggerated claims. ₱999 means ₱999. Our prices never lie.' },
    { title: 'Real Support', desc: 'Real people answering. Fast fixes. Technicians 7 days a week. We actually pick up the phone.' },
    { title: 'Community Fiber', desc: 'Fiber that reaches barangays, condos, schools, and sari-sari stores across Pampanga.' },
    { title: 'Zero Fine Print', desc: 'What you pay for, you actually get. No asterisks, no lock-in, no runaround.' },
  ];

  return (
    <>
      <Hero onCTA={(t) => onNav(t === 'plans' ? 'Plans' : 'Plans')} />

      {/* Why Fibex */}
      <div className="why-section">
        <div style={{ fontFamily: "'Baufra', sans-serif", fontWeight: 700, fontSize: 10, letterSpacing: '0.4em', textTransform: 'uppercase', color: '#0119FE', marginBottom: 12, textAlign: 'center' }}>Why Fibex</div>
        <h2 style={{ fontFamily: "'Origin', sans-serif", fontWeight: 900, fontSize: 'clamp(32px, 4vw, 52px)', color: '#000', textAlign: 'center', lineHeight: 1.05 }}>Built different.</h2>
        <div className="why-grid">
          {whyItems.map(w => (
            <div key={w.title} className="why-item">
              <div className="why-title">{w.title}</div>
              <p className="why-desc">{w.desc}</p>
            </div>
          ))}
        </div>
      </div>

      {/* Plans preview with category slider */}
      <HomePlansSlider onNav={onNav} />

      {/* Testimonials */}
      <Testimonials />

      {/* CTA Banner */}
      <div className="cta-banner">
        <div style={{ fontFamily: "'Baufra', sans-serif", fontWeight: 700, fontSize: 10, letterSpacing: '0.4em', textTransform: 'uppercase', color: 'rgba(255,255,255,0.4)', marginBottom: 16 }}>Ready?</div>
        <h2 style={{ fontFamily: "'Origin', sans-serif", fontWeight: 900, fontSize: 'clamp(40px, 5vw, 64px)', color: '#fff', lineHeight: 1.05, marginBottom: 12 }}>WiFi for all.</h2>
        <p style={{ fontFamily: "'Montserrat', sans-serif", fontSize: 16, color: 'rgba(255,255,255,0.6)', marginBottom: 36 }}>Fast, reliable, and honest — for every home and business.</p>
        <div style={{ display: 'flex', gap: 14, justifyContent: 'center' }}>
          <FibexBtn variant="whiteBlue" size="lg" onClick={() => onNav('Plans')}>See Plans</FibexBtn>
          <FibexBtn variant="outlineWhite" size="lg" onClick={() => onNav('Contact')}>Apply Now</FibexBtn>
        </div>
      </div>
    </>
  );
}

// ── App ──────────────────────────────────────────────────────────────────────
function App() {
  const saved = localStorage.getItem('fibex_page') || 'Home';
  const [page, setPage] = React.useState(saved);
  const [tweaks, setTweaks] = React.useState(TWEAK_DEFAULTS);

  const nav = (p) => {
    setPage(p);
    localStorage.setItem('fibex_page', p);
    window.scrollTo({ top: 0 });
  };

  React.useEffect(() => {
    window.addEventListener('message', (e) => {
      if (e.data?.type === '__activate_edit_mode') document.getElementById('tweak-panel').style.display = 'block';
      if (e.data?.type === '__deactivate_edit_mode') document.getElementById('tweak-panel').style.display = 'none';
    });
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
  }, []);

  const updateTweak = (key, val) => {
    const next = { ...tweaks, [key]: val };
    setTweaks(next);
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: next }, '*');
  };

  return (
    <div>
      <div id="tweak-panel">
        <h3>Tweaks</h3>
        <div className="tweak-row">
          <span className="tweak-label">Hero Headline 1</span>
          <input type="text" value={tweaks.heroHeadline1} onChange={e => updateTweak('heroHeadline1', e.target.value)} style={{ width:'100%', padding:'8px 12px', borderRadius:8, border:'1.5px solid #e0e0e0', fontFamily:'Montserrat', fontSize:13 }} />
        </div>
        <div className="tweak-row">
          <span className="tweak-label">Hero Headline 2</span>
          <input type="text" value={tweaks.heroHeadline2} onChange={e => updateTweak('heroHeadline2', e.target.value)} style={{ width:'100%', padding:'8px 12px', borderRadius:8, border:'1.5px solid #e0e0e0', fontFamily:'Montserrat', fontSize:13 }} />
        </div>
        <div className="tweak-row">
          <span className="tweak-label">Accent Color</span>
          <input type="color" value={tweaks.accentColor} onChange={e => updateTweak('accentColor', e.target.value)} />
        </div>
      </div>

      <Header page={page} onNav={nav} />
      <div style={{ paddingTop: 68 }}>
        <div className="page-enter" key={page}>
          {page === 'Home'    && <HomePage onNav={nav} />}
          {page === 'Plans'   && <PlansPage onApply={() => nav('Contact')} />}
          {page === 'About'   && <AboutPage onNav={nav} />}
          {page === 'Contact' && <ContactPage />}
        </div>
        <Footer onNav={nav} />
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
